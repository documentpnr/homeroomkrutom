<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- อัปเดต Viewport สำหรับ LINE In-App Browser และมือถือที่มีรอยบาก -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  
  <title>ระบบการบ้านนักเรียน</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* ใช้หน่วย vw และ dvh (Dynamic Viewport Height) เพื่อแก้ปัญหาจอ LINE */
      width: 100vw; 
      height: 100dvh; 
      /* ถ้ามือถือรุ่นเก่ามากไม่รู้จัก dvh ให้ใช้ vh สำรองไว้ */
      min-height: 100vh; 
      overflow: hidden; 
      background-color: #f8f9fa;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- นำลิงก์ Web App ของ Google มาใส่ที่ src ตรงนี้ครับ -->
  <iframe src="https://script.google.com/a/macros/pranarai.ac.th/s/AKfycbyVptoSdGkjyj6p8Z9iRQ0dBF1FLdIOxacQCP9qAh34I3kOqiDne_eKRTyZQV4_c2Y/exec"></iframe>

</body>
</html>
