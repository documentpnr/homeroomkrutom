<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>ระบบบันทึกการบ้าน PNR M.1/10</title>
  
  <style>
    /* ตั้งค่าให้หน้าเว็บและ Iframe ขยายเต็มจอ 100% ไม่มีขอบขาว */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh; /* ใช้ dvh เพื่อให้พอดีกับเบราว์เซอร์มือถือเวลาเลื่อนจอ */
      min-height: 100vh; /* เผื่อมือถือรุ่นเก่า */
      overflow: hidden; /* ป้องกันแถบเลื่อนซ้อนกัน 2 ชั้น */
      background-color: #f0fdf4; /* สีพื้นหลังระหว่างรอโหลด */
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/a/macros/pranarai.ac.th/s/AKfycbyVptoSdGkjyj6p8Z9iRQ0dBF1FLdIOxacQCP9qAh34I3kOqiDne_eKRTyZQV4_c2Y/exec"></iframe>

</body>
</html>
